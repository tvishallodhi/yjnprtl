{{ $related := .Site.RegularPages.Related . | first 5 }}
{{ with $related }}
<aside class="related-posts-section" aria-label="Related Posts">
  <h3 class="related-heading">Related Content</h3>
  <ul class="related-links-list">
    {{ range . }}
      <li class="related-item" data-lang="{{ .Params.lang | default "" }}">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</aside>
{{ end }}
