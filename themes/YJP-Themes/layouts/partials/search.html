<div class="search-main">
  <div class="search-box-wrapper" role="search">
    <form class="search-box-form" action="{{ "/search/" | relURL }}" method="get">
      <div class="search-input-group" id="searchGroup">
        
        <!-- Search Trigger Icon (Mobile par click karne par khulega / Form submit karega) -->
        <button type="button" class="search-trigger-btn" id="searchTriggerBtn" aria-label="Open Search">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Input Field -->
        <input
          type="search"
          class="search-input"
          id="searchInput"
          name="q"
          placeholder="Search jobs, schemes, articles..."
          autocomplete="off"
          required
        >

        <!-- Close / Cancel Button (Mobile par wapas band karne ke liye) -->
        <button type="button" class="search-close-btn" id="searchCloseBtn" aria-label="Close Search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- Submit Button (Desktop ke liye) -->
        <button type="submit" class="search-submit-btn">
          Search
        </button>

      </div>
    </form>
  </div>
</div>
