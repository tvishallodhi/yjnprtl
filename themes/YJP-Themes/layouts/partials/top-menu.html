<nav class="nav-bar-strip" aria-label="Secondary Horizontal Navigation">
  <div class="nav-bar-container">
    <button type="button" class="nav-hamburger-btn" id="menuToggleBtn" aria-label="Toggle Navigation Menu" aria-controls="mobileSidebarDrawer" aria-expanded="false">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
    
   

<div class="nav-scrollable-track" id="horizontalNavTrack">
  <ul class="nav-list">

    {{ $currentURL := .RelPermalink }}

    {{ range sort .Site.Data.menus.header.header "weight" }}
      {{ $menuURL := .url | relURL }}

      <li class="nav-item">
        <a href="{{ $menuURL }}"
           class="nav-link{{ if eq $currentURL $menuURL }} is-active{{ end }}">

          {{ with .icon }}
            <span class="nav-icon" aria-hidden="true">{{ . }}</span>
          {{ end }}

          <span class="nav-text">{{ .name }}</span>

        </a>
      </li>
    {{ end }}

  </ul>
</div>
  </div>
</nav>
