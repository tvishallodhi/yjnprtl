{{ with .Params.eligibility }}
<section class="section-block" id="eligibility">
  <h2>🧍{{ partial "farmate/keywords.html" (dict "Page" $ "index" 1) }} - Eligibility</h2>

  <ul>
    {{ if reflect.IsSlice . }}
      {{ range . }}
        {{ with . }}
          <li>{{ . | markdownify }}</li>
        {{ end }}
      {{ end }}
    {{ else }}
      <li>{{ . | markdownify }}</li>
    {{ end }}
  </ul>
</section>
{{ end }}
