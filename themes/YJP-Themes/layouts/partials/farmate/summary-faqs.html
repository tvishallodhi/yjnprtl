{{ with .Params.faqs }}
<div class="faq-container">

  {{ range . }}
    <details class="faq-item">

      <summary class="faq-summary">
        <span class="faq-icon">❓</span>
        <span class="faq-question">
          {{ .question | strings.TrimSpace }}
        </span>
      </summary>

      {{ with .answer }}
        <div class="faq-answer">
          <p>{{ . | strings.TrimSpace | markdownify }}</p>
        </div>
      {{ end }}

    </details>
  {{ end }}

</div>
{{ end }}
