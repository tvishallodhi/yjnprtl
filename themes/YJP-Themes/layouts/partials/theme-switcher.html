<div class="export-options">

  <!-- Share -->
  <button type="button"
          class="ctrl-btn share-btn"
          id="shareBtn"
          aria-label="Share this page"
          title="Share this page">
    <span class="share-icon" aria-hidden="true"><img src="{{ "icons/share.svg" | relURL }}" alt ="share-icon"></span>
  </button>
</div>
<div class="export-options1">
  <!-- Copy Link -->
  <button type="button"
          class="ctrl-btn copy-link-btn"
          id="copyLinkBtn"
          aria-label="Copy page link"
          title="Copy page link">
    <span class="copy-icon" aria-hidden="true"><img src="{{ "icons/copy-link.svg" | relURL }}" alt ="copy-link-icon"></span>
  </button>

</div>
  <div class="theme-switcher">
    <button type="button" class="ctrl-btn theme-btn" id="themeToggleBtn" aria-label="Toggle Color Theme" title="Switch theme (Light / Dark / System)">
      <span class="theme-icon icon-light" aria-hidden="true">☀️</span>
      <span class="theme-icon icon-dark" aria-hidden="true">🌙</span>
      <span class="theme-icon icon-system" aria-hidden="true">🌓</span>
    </button>
  </div>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const shareBtn = document.getElementById("shareBtn");
  const copyLinkBtn = document.getElementById("copyLinkBtn");

  const pageTitle = {{ if .Params.seo_title }}{{ .Params.seo_title | jsonify }}{{ else }}{{ .Title | jsonify }}{{ end }} + " | Yojana Portal";
  const pageUrl = window.location.href;

  const shareText = pageTitle + "\n\n" + pageUrl;


  // Share
  if (shareBtn) {
    shareBtn.addEventListener("click", async function () {

      const shareData = {
        title: pageTitle,
        text: shareText,
        url: pageUrl
      };

      if (navigator.share) {

        try {
          await navigator.share(shareData);

        } catch (error) {
          // User cancelled share
        }

      } else {

        // Fallback: Copy title + link
        try {
          await navigator.clipboard.writeText(shareText);

          const oldTitle = shareBtn.getAttribute("title");

          shareBtn.setAttribute("title", "Copied!");

          setTimeout(() => {
            shareBtn.setAttribute("title", oldTitle);
          }, 1500);

        } catch (error) {
          console.error("Unable to share or copy link.");
        }

      }
    });
  }


  // Copy Link
  if (copyLinkBtn) {
    copyLinkBtn.addEventListener("click", async function () {

      try {
        await navigator.clipboard.writeText(shareText);

        const icon = copyLinkBtn.querySelector(".copy-icon");

        // Original SVG ko preserve karega
        const oldHTML = icon.innerHTML;

        // Temporary check mark
        icon.innerHTML = "✓";

        copyLinkBtn.setAttribute("title", "Copied!");

        setTimeout(() => {

          // Original copy-link.svg wapas
          icon.innerHTML = oldHTML;

          copyLinkBtn.setAttribute("title", "Copy page link");

        }, 1500);

      } catch (error) {
        console.error("Unable to copy link.");
      }

    });
  }

});
</script>

/* ==========================================================================
   Mobile Action Menu
   ========================================================================== */

.mobile-action-menu {
  display: none;
  position: relative;
}

.mobile-action-toggle {
  cursor: pointer;
}


/* Dropdown */

.mobile-action-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;

  min-width: 155px;
  padding: 6px;

  display: none;

  background: var(--bg-surface);
  color: var(--text-main);

  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);

  box-shadow: var(--box-shadow);

  z-index: 9999;
}

.mobile-action-dropdown.show {
  display: block;
}


/* Menu Items */

.mobile-action-item {
  width: 100%;

  display: flex;
  align-items: center;
  gap: 10px;

  padding: 10px 12px;

  border: 0;
  border-radius: var(--border-radius);

  background: transparent;
  color: var(--text-main);

  font-size: var(--font-size);
  text-align: left;

  cursor: pointer;
}


/* Hover */

.mobile-action-item:hover {
  background: var(--bg-secondary);
}


/* Icons */

.mobile-action-icon {
  width: 20px;
  height: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}

.mobile-action-icon img {
  width: 20px;
  height: 20px;
  display: block;
}


/* Dark Mode SVG */

[data-color-mode="dark"] .mobile-action-icon img {
  filter: brightness(0) invert(1);
}


/* System Mode + OS Dark */

@media (prefers-color-scheme: dark) {
  [data-color-mode="system"] .mobile-action-icon img {
    filter: brightness(0) invert(1);
  }
}


/* ==========================================================================
   Mobile
   ========================================================================== */

@media (max-width: 768px) {

  /* Existing desktop buttons hide */
  .export-options,
  .export-options1,
  .theme-switcher {
    display: none;
  }

  /* Mobile menu show */
  .mobile-action-menu {
    display: block;
  }

}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const toggle = document.getElementById("mobileActionToggle");
  const dropdown = document.getElementById("mobileActionDropdown");

  const mobileShare = document.getElementById("mobileShareBtn");
  const mobileCopy = document.getElementById("mobileCopyLinkBtn");
  const mobileTheme = document.getElementById("mobileThemeBtn");

  const shareBtn = document.getElementById("shareBtn");
  const copyLinkBtn = document.getElementById("copyLinkBtn");
  const themeBtn = document.getElementById("themeToggleBtn");


  /* Open / Close */

  if (toggle && dropdown) {

    toggle.addEventListener("click", function (e) {

      e.stopPropagation();

      const isOpen = dropdown.classList.toggle("show");

      toggle.setAttribute(
        "aria-expanded",
        isOpen ? "true" : "false"
      );

    });

  }


  /* Share */

  if (mobileShare && shareBtn) {

    mobileShare.addEventListener("click", function () {

      shareBtn.click();

      closeMenu();

    });

  }


  /* Copy Link */

  if (mobileCopy && copyLinkBtn) {

    mobileCopy.addEventListener("click", function () {

      copyLinkBtn.click();

      closeMenu();

    });

  }


  /* Theme */

  if (mobileTheme && themeBtn) {

    mobileTheme.addEventListener("click", function () {

      themeBtn.click();

      closeMenu();

    });

  }


  /* Close */

  function closeMenu() {

    if (!dropdown) return;

    dropdown.classList.remove("show");

    if (toggle) {

      toggle.setAttribute(
        "aria-expanded",
        "false"
      );

    }

  }


  /* Click outside */

  document.addEventListener("click", function (e) {

    if (
      dropdown &&
      toggle &&
      !dropdown.contains(e.target) &&
      !toggle.contains(e.target)
    ) {

      closeMenu();

    }

  });

});
</script>
