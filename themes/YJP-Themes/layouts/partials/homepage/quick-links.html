<style>
    .main-wrapper-card * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* मुख्य बाहरी कार्ड कंटेनर */
    .main-wrapper-card {
        position: relative;
        max-width: 1180px;
        margin: 20px auto;
        padding: 32px 24px;
        font-family: 'Poppins', sans-serif;
        font-size: var(--font-size, 16px);
        background: var(--ql-wrapper-bg);
        border-radius: var(--radius-wrapper-curved);
        border: 1.5px solid var(--ql-wrapper-border);
        box-shadow: var(--ql-wrapper-shadow);
        overflow: hidden;
        transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* सजावटी कर्व्ड शेप */
    .main-wrapper-card::before {
        content: '';
        position: absolute;
        top: -60px;
        right: -60px;
        width: 240px;
        height: 240px;
        background: radial-gradient(circle, var(--ql-decor-glow) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }

    .main-wrapper-card::after {
        content: '';
        position: absolute;
        bottom: -80px;
        left: -40px;
        width: 300px;
        height: 180px;
        background: var(--ql-decor-blob);
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        pointer-events: none;
    }

    /* ग्रिड लेआउट */
    .quick-links-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
        gap: 16px;
    }

    /* अंदर के छोटे कार्ड्स */
    .link-card {
        position: relative;
        background: var(--ql-card-bg);
        backdrop-filter: blur(8px);
        border: 1.5px solid var(--ql-card-border);
        border-radius: var(--radius-card-curved);
        padding: 20px 12px;
        text-align: center;
        text-decoration: none;
        color: var(--text-dark);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        box-shadow: var(--ql-card-shadow);
        transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
    }

    .link-card::before {
        content: '';
        position: absolute;
        top: -15px;
        right: -15px;
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, var(--ql-decor-glow), transparent);
        border-radius: 50%;
        transition: transform 0.35s ease;
    }

    .link-card:hover {
        transform: translateY(-6px) scale(1.02);
        background: var(--ql-card-hover-bg);
        border-color: var(--ql-card-hover-border);
        box-shadow: var(--ql-card-hover-shadow);
    }

    .link-card:focus-visible {
        outline: var(--focus-ring);
        outline-offset: 2px;
    }

    .link-card:hover::before {
        transform: scale(1.6);
    }

    /* आइकन बॉक्स (डिफ़ॉल्ट रंग आपके --badge-mp वेरिएबल्स से लिए गए हैं) */
    .icon-wrapper {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-icon-curved);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--badge-mp-bg, #ffedd5);
        color: var(--badge-mp-text, #9a3412);
        transition: all 0.35s ease;
        box-shadow: inset 0 0 0 1px var(--border-subtle);
    }

    .icon-wrapper img,
    .icon-wrapper svg {
        width: 28px;
        height: 28px;
        object-fit: contain;
        transition: transform 0.35s ease;
    }

    .link-card:hover .icon-wrapper {
        transform: rotate(-4deg) scale(1.1);
        border-radius: 50%;
    }

    .card-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: 0.2px;
        transition: color 0.3s ease;
    }

    .link-card:hover .card-title {
        color: var(--ql-title-hover);
    }

    /* मोबाइल स्क्रीन के लिए */
    @media (max-width: 480px) {
        .main-wrapper-card {
            padding: 20px 14px;
            border-radius: 24px 10px 24px 10px;
        }
        .quick-links-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .link-card {
            padding: 16px 8px;
        }
    }
</style>

{{ with index site.Data "quick-link" }}
<div class="main-wrapper-card">
    <div class="quick-links-grid">
        {{ range .items }}
            {{ $isExternal := strings.HasPrefix .url "http" }}
            <a href="{{ .url | safeURL }}" 
               class="link-card"
               {{ if $isExternal }}target="_blank" rel="noopener noreferrer"{{ end }}>
                
                <div class="icon-wrapper" 
                     style="{{ with .bg_color }}background-color: {{ . }};{{ end }} {{ with .icon_color }}color: {{ . }};{{ end }}">
                    <img src="{{ .svgicon | relURL }}" alt="{{ .title }}" loading="lazy">
                </div>
                
                <span class="card-title">{{ .title }}</span>
            </a>
        {{ end }}
    </div>
</div>
{{ end }}
