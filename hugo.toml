baseURL = "https://yojanaportal.com/"
title = "Yojana Portal"
theme = "YJP-Themes"

defaultContentLanguage = "en"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

# Hugo के डिफ़ॉल्ट सिंगल sitemap को बंद करें ताकि कस्टम इंडेक्स ओवरराइट न हो
[sitemap]
  disable = true

# 1. कस्टम मीडिया टाइप
[mediaTypes."application/sitemap+xml"]
  suffixes = ["xml"]

# 2. कस्टम आउटपुट फॉर्मेट्स
[outputFormats.SitemapIndex]
  mediaType = "application/sitemap+xml"
  baseName = "sitemap"
  isPlainText = false
  notAlternative = true

[outputFormats.SitemapJobs]
  mediaType = "application/sitemap+xml"
  baseName = "sitemap-jobs"
  isPlainText = false
  notAlternative = true

[outputFormats.SitemapYojana]
  mediaType = "application/sitemap+xml"
  baseName = "sitemap-yojana"
  isPlainText = false
  notAlternative = true

[outputFormats.SitemapEducation]
  mediaType = "application/sitemap+xml"
  baseName = "sitemap-education"
  isPlainText = false
  notAlternative = true
 
[outputFormats.SitemapPages]
  mediaType = "application/sitemap+xml"
  baseName = "sitemap-pages"
  isPlainText = false
  notAlternative = true

[outputs]
   home = ["HTML", "RSS", "SitemapIndex", "SitemapPages", "SitemapJobs", "SitemapYojana", "SitemapEducation"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  page = ["HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  date = 2025-07-03T10:02:12+05:30
  description = "Lightweight, language-aware portal framework."
  defaultSidebarIcon = "↪️"
  defaultLanguage = "hi"
  logo = "/images/logo.svg"
  sitemap_custom_urls = [
    # "/custom-tool-path/",
    # "/external-service/"
  ]

[related]
  threshold = 30
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 80

  [[related.indices]]
    name = "keywords"
    weight = 60
# Footer Menu Items


  [minify]
  disableXML = false
  minifyOutput = true

  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
      keepConditionalComments = true
      keepDefaultAttrVals = true
      keepDocumentTags = true
      keepEndTags = true
      keepQuotes = false
      keepWhitespace = false

    [minify.tdewolff.css]
      keepCSS2 = true

    [minify.tdewolff.js]
      keepVarNames = false
      precision = 0

    [minify.tdewolff.json]
      keepNumbers = false

    [minify.tdewolff.svg]
      keepComments = false

  