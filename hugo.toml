baseURL = "https://yojanaportal.com/"
title = "YojanaPortal"
theme = "YJP-Themes"

defaultContentLanguage = "en"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  page = ["HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  description = "Lightweight, language-aware portal framework."
  defaultSidebarIcon = "↪️"
  defaultLanguage = "hi"
  logo = "/images/logo.svg"


