<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOJANA PORTAL - Offline</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --brand: #2563eb;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      display: block;
      object-fit: contain;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.15rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      background-color: var(--brand);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="/pwa/icon-192.png" alt="YOJANA PORTAL Logo" class="logo">
    <h1>YOJANA PORTAL</h1>
    <h2>You are offline</h2>
    <p>No internet connection available. Please check your network connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
  </main>
</body>
</html>
